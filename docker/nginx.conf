# Serves the built single-page app and forwards the API paths to the Rails
# backend, so the browser only ever talks to one origin and the bundle can use
# relative URLs. `API_UPSTREAM` is substituted by docker-compose's `environment`
# via the official image's envsubst templating when mounted as a template; in
# the plain image it defaults to the compose service name below.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; index.html must never be cached.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API surface. Everything else falls through to the SPA.
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Authorization;
    }

    # `/login` and `/signup` are also client-side routes, so only the writes go
    # upstream: a browser navigating to /login must receive the app, not JSON.
    location ~ ^/(login|logout|signup)$ {
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }
        proxy_pass         http://api:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Referrer-Policy        strict-origin-when-cross-origin;
}
