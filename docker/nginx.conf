# Serves the built single-page app and forwards the API paths to the Rails
# backend, so the browser only ever talks to one origin and the bundle can use
# relative URLs. The upstream is the `api` hostname: the mock-api service's
# network alias in docker-compose.yml, or the Rails API on a shared network.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # A location with its own add_header drops every server-level one, so the
    # security headers are repeated wherever a location sets Cache-Control.
    # Hashed assets are immutable; index.html must never be cached.
    location /static/ {
        add_header Cache-Control          "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy        strict-origin-when-cross-origin;
    }

    location = /index.html {
        add_header Cache-Control          "no-store";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options        SAMEORIGIN;
        add_header Referrer-Policy        strict-origin-when-cross-origin;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API surface. Everything else falls through to the SPA.
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Authorization;
    }

    # `/login` and `/signup` are also client-side routes, so only the writes go
    # upstream: a browser navigating to /login must receive the app, not JSON.
    location ~ ^/(login|logout|signup)$ {
        if ($request_method ~ ^(GET|HEAD)$) {
            rewrite ^ /index.html last;
        }
        proxy_pass         http://api:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  Authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Referrer-Policy        strict-origin-when-cross-origin;
}
